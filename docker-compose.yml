# LifeOps — web, worker, and a one-shot init, sharing one volume.
#
#   cp .env.example .env    # edit it: the endpoint and the model are the only two that matter
#   docker compose up -d
#
# Three services written out rather than sharing a YAML anchor: the differences between them
# are the design (only init and worker talk to the model; only web publishes a port), and an
# operator reading this file should not have to resolve merge keys to see that.
#
# No model server here. Inference runs on the operator's own network, on hardware that can
# hold a model — see docs/DEPLOY.md and docs/DECISIONS.md.

name: lifeops

services:
  # Runs to completion before anything else starts. It checks the LLM endpoint is real and
  # serves the configured model, then applies migrations. Both other services wait on it
  # succeeding, so migrations happen exactly once with nothing racing them, and a
  # misconfigured endpoint means the stack does not come up — rather than a web process
  # cheerfully accepting captures nothing can ever extract.
  init:
    image: ghcr.io/coreycarvalho/lifeops:${LIFEOPS_IMAGE_TAG:-latest}
    command: ["npm", "run", "init"]
    env_file: [.env]
    environment:
      # Pinned here, not in .env: where state lives inside the container is a packaging
      # fact, and this is what keeps "back up one volume" true.
      LIFEOPS_DB_PATH: /data/lifeops.db
    volumes:
      - lifeops-data:/data
    # Lets LLM_BASE_URL reach a model server running on the Docker host itself, as
    # http://host.docker.internal:11434/v1. Inside a container, localhost is the container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

  web:
    image: ghcr.io/coreycarvalho/lifeops:${LIFEOPS_IMAGE_TAG:-latest}
    command: ["npm", "run", "start"]
    env_file: [.env]
    environment:
      LIFEOPS_DB_PATH: /data/lifeops.db
    volumes:
      - lifeops-data:/data
    ports:
      # No TLS and no auth by design — single user behind network-level access control.
      # Bind this to a LAN or VPN address, never to a public one. See docs/DEPLOY.md.
      - "${LIFEOPS_PORT:-3000}:3000"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    image: ghcr.io/coreycarvalho/lifeops:${LIFEOPS_IMAGE_TAG:-latest}
    # Extraction is its own process, never a request handler: one dump can take minutes.
    command: ["npm", "run", "worker"]
    env_file: [.env]
    environment:
      LIFEOPS_DB_PATH: /data/lifeops.db
    volumes:
      - lifeops-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  # The whole of the operator's data: the SQLite file, its WAL sidecars, and from M3 the
  # config file. Backing LifeOps up is copying this. Issue #1 decides how.
  lifeops-data:
